name: Foundation contracts
on:
  pull_request:
    paths: ['bots/foundation/**', '.github/workflows/foundation.yml']
  push:
    branches: ['fran/foundation-baseline']
    paths: ['bots/foundation/**', '.github/workflows/foundation.yml']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install cambc==2.2.5
      - run: cambc init --yes
      - run: python bots/foundation/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: out/foundation/
