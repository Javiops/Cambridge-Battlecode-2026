[runtime]
ruleset = "cambc2026a-week2-2026-10-20"
cli_version = "cambc 3.0.1"
# Observed in a completed release match on 00collision. Changing this starts a new experiment.
engine_build_hash = "2b36d9c61b2710d06036680d07fc4b7a8319ba35f634e4f1445725e0d99a1e16"

[league]
# The frozen panel: fixed, versioned opponents that every new version plays.
# When this list changes, bump panel_version, so old and new reports are never mixed.
panel_version = 4
panel = ["dummy-week2-v1", "starter-week2-v1", "calib-seed-week2-v1",
         "calib-skip10-week2-v1", "calib-skip2-week2-v1"]
# Two versions of equal strength. Their gap is printed in every report as the noise band:
# a difference smaller than this between any two versions is not a result.
noise_pair = ["starter-week2-v1", "calib-seed-week2-v1"]
# The current best version. Every new version starts from it (copy, change one thing).
champion = "starter-week2-v1"
jobs = 0             # parallel games; 0 = one per CPU core
# Carson's stopping rule (cb-bc ABLATION_PROMPT.md): stop a line of work when the best rating
# gains less than this for two league runs in a row.
plateau_points = 20

[gate]
# Promotion gate, after Carson's kaggriculture finalist gates (>= 0.5 vs the best, >= 0.9 vs starter).
vs_champion = 0.50   # score against the champion on the confirm maps, both sides
vs_weak = 0.90       # score against the weak bot on the confirm maps, both sides
weak = "starter-week2-v1"
max_faults = 0       # bot faults across all gate games
max_fuel_exhausted_per_game = 1.0  # average turns lost to fuel per game, our side

[stage1]
# Exact official v1.0.0 rules module distributed by CLI 3.0.1; never select assets by mtime.
engine_wasm_sha256 = "f7d27c468024ce20f1f64eb1bd06ec4de6314213314fb0132e8b605cf0a610db"
screen_maps = 100
confirm_maps = 60
screen_seed = 2026102001
confirm_seed = 2026102002
jobs = 4
max_kernel_fuel = 65000
max_prelog_fuel = 85000
min_observed_turns_per_second = 500
handicaps = ["calib-skip10-week2-v1", "calib-skip2-week2-v1"]
request_timeout = 30
benchmark_envs = 16
benchmark_steps = 100
parity_maps = ["00collision", "generated/screen/g1-screen-000", "generated/screen/g1-screen-003", "generated/screen/g1-screen-002"]
