# The lab's settings. Configs are the source of truth (Carson, orbit-wars AGENTS.md):
# change a number here, not in the scripts.

[maps]
# Each set has one job and the jobs never swap.
# screen  = where we look while developing; tune freely.
# confirm = only for the promotion gate; never look at these games while tuning.
# Only 17 site maps exist so far, so confirm holds 5 of them until we have a map generator
# (ROADMAP.md). The qualifying maps will be new, so the generator is the real confirm set.
screen = ["ambush", "collision", "contest", "corners", "eight", "elkring",
          "expanse", "fragment", "interlock", "lanes", "monolith", "packs"]
confirm = ["pilgrimage", "rows", "rushbait-v2", "stampede", "swirl"]

[league]
# The frozen panel: fixed, versioned opponents that every new version plays.
# When this list changes, bump panel_version, so old and new reports are never mixed.
panel_version = 1
panel = ["dummy-v1", "starter-v1"]
# The current best version. Every new version starts from it (copy, change one thing).
champion = "starter-v1"
jobs = 4

[gate]
# Promotion gate, after Carson's kaggriculture finalist gates (>= 0.5 vs the best, >= 0.9 vs starter).
vs_champion = 0.50   # score against the champion on the confirm maps, both sides
vs_weak = 0.90       # score against the weak bot on the confirm maps, both sides
weak = "starter-v1"
max_faults = 0       # bot faults across all gate games
max_fuel_exhausted_per_game = 1.0  # average turns lost to fuel per game, our side
